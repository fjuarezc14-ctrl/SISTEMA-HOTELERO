services:
  postgres:
    image: postgres:16-alpine
    container_name: hotel_peru_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-hotel_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hotel_secret_2026}
      POSTGRES_DB: ${DB_NAME:-hotel_peru_db}
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./backend/database/seeds.sql:/docker-entrypoint-initdb.d/2_seeds.sql
    networks:
      - hotel_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hotel_peru_backend
    restart: always
    ports:
      - "4020:4020"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=4020
      - TZ=America/Lima
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-hotel_admin}
      - DB_PASSWORD=${DB_PASSWORD:-hotel_secret_2026}
      - DB_NAME=${DB_NAME:-hotel_peru_db}
      - JWT_SECRET=${JWT_SECRET:-valetec_hotel_peru_jwt_secret_2026}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://hotelprueba.valetec.pe}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://hotelprueba.valetec.pe}
      - FRONTEND_URL=${FRONTEND_URL:-https://hotelprueba.valetec.pe}
    depends_on:
      - postgres
    networks:
      - hotel_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hotel_peru_frontend
    restart: always
    ports:
      - "5185:80"
    depends_on:
      - backend
    networks:
      - hotel_network

volumes:
  postgres_data:
    driver: local

networks:
  hotel_network:
    driver: bridge
